{% extends "base.html" %}

{% block title %}Edit Farmer{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">
            <h3 class="mb-0">Edit Farmer</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ farmer['name'] }}"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input
                            type="text"
                            name="mobile"
                            class="form-control"
                            value="{{ farmer['mobile'] }}"
                            required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Age</label>
                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            value="{{ farmer['age'] }}"
                            required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Gender</label>

                        <select
                            name="gender"
                            class="form-select"
                            required>

                            <option value="Male"
                                {% if farmer['gender']=="Male" %}selected{% endif %}>
                                Male
                            </option>

                            <option value="Female"
                                {% if farmer['gender']=="Female" %}selected{% endif %}>
                                Female
                            </option>

                            <option value="Other"
                                {% if farmer['gender']=="Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Aadhaar Number</label>
                        <input
                            type="text"
                            name="aadhaar"
                            class="form-control"
                            value="{{ farmer['aadhaar'] }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Village</label>
                        <input
                            type="text"
                            name="village"
                            class="form-control"
                            value="{{ farmer['village'] }}"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">District</label>
                        <input
                            type="text"
                            name="district"
                            class="form-control"
                            value="{{ farmer['district'] }}"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Land Area (Acres)</label>
                        <input
                            type="number"
                            step="0.01"
                            name="land"
                            class="form-control"
                            value="{{ farmer['land'] }}"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Crop</label>
                        <input
                            type="text"
                            name="crop"
                            class="form-control"
                            value="{{ farmer['crop'] }}"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">

    <label class="form-label">
        Subsidy Type
    </label>

    <select
        name="subsidy"
        class="form-select"
        required>

        <option value="Rice Seeds" {% if farmer['subsidy']=="Rice Seeds" %}selected{% endif %}>Rice Seeds</option>

        <option value="Wheat Seeds" {% if farmer['subsidy']=="Wheat Seeds" %}selected{% endif %}>Wheat Seeds</option>

        <option value="DAP Fertilizer" {% if farmer['subsidy']=="DAP Fertilizer" %}selected{% endif %}>DAP Fertilizer</option>

        <option value="Urea" {% if farmer['subsidy']=="Urea" %}selected{% endif %}>Urea</option>

        <option value="Organic Fertilizer" {% if farmer['subsidy']=="Organic Fertilizer" %}selected{% endif %}>Organic Fertilizer</option>

        <option value="Pesticide" {% if farmer['subsidy']=="Pesticide" %}selected{% endif %}>Pesticide</option>

        <option value="Sprayer" {% if farmer['subsidy']=="Sprayer" %}selected{% endif %}>Sprayer</option>

        <option value="Drip Kit" {% if farmer['subsidy']=="Drip Kit" %}selected{% endif %}>Drip Kit</option>

        <option value="Water Pump" {% if farmer['subsidy']=="Water Pump" %}selected{% endif %}>Water Pump</option>

        <option value="Tractor Subsidy" {% if farmer['subsidy']=="Tractor Subsidy" %}selected{% endif %}>Tractor Subsidy</option>

    </select>

</div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Eligible Quantity</label>
                        <input
                            type="number"
                            name="eligible"
                            class="form-control"
                            value="{{ farmer['eligible'] }}"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Latitude</label>
                        <input
                            type="text"
                            name="latitude"
                            class="form-control"
                            value="{{ farmer['latitude'] }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Longitude</label>
                        <input
                            type="text"
                            name="longitude"
                            class="form-control"
                            value="{{ farmer['longitude'] }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Bank Name</label>
                        <input
                            type="text"
                            name="bank"
                            class="form-control"
                            value="{{ farmer['bank'] }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Account Number</label>
                        <input
                            type="text"
                            name="account"
                            class="form-control"
                            value="{{ farmer['account'] }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">IFSC Code</label>
                        <input
                            type="text"
                            name="ifsc"
                            class="form-control"
                            value="{{ farmer['ifsc'] }}">
                    </div>

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-warning">

                        Update Farmer

                    </button>

                    <a
                        href="{{ url_for('farmer_details', id=farmer['id']) }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
