{% extends "base.html" %}

{% block title %}
Farmer Location Map | AgriSetu
{% endblock %}

{% block content %}

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

#map{
    height:650px;
    width:100%;
    border-radius:12px;
}

</style>

<div class="container-fluid">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold text-success">

                <i class="bi bi-geo-alt-fill"></i>

                Farmer Location Map

            </h2>

            <p class="text-muted">

                Click on any farmer marker to view complete details.

            </p>

        </div>

        <a href="{{ url_for('dashboard') }}"
           class="btn btn-success">

            <i class="bi bi-speedometer2"></i>

            Dashboard

        </a>

    </div>

    <!-- Map -->

    <div class="card shadow">

        <div class="card-body">

            <div id="map"></div>

        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Default center (Tamil Nadu)
var map = L.map('map').setView([11.1271, 78.6569], 7);

// OpenStreetMap Tiles
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}).addTo(map);

// Red Marker
var redIcon = L.icon({

    iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',

    shadowUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',

    iconSize:[25,41],

    iconAnchor:[12,41],

    popupAnchor:[1,-34],

    shadowSize:[41,41]

});

var bounds = [];
var markerCount = 0;

{% for farmer in farmers %}

{% if farmer.latitude and farmer.longitude %}

var lat = parseFloat("{{ farmer.latitude }}");
var lng = parseFloat("{{ farmer.longitude }}");

if(!isNaN(lat) && !isNaN(lng)){

    var marker = L.marker([lat,lng],{

        icon:redIcon

    }).addTo(map);

    marker.bindPopup(`

<div style="min-width:300px;">

<h5 class="text-success">

{{ farmer.name }}

</h5>

<table class="table table-sm mb-2">

<tr>
<td><b>ID</b></td>
<td>{{ farmer.id }}</td>
</tr>

<tr>
<td><b>Age</b></td>
<td>{{ farmer.age }}</td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>{{ farmer.gender }}</td>
</tr>

<tr>
<td><b>Mobile</b></td>
<td>{{ farmer.mobile }}</td>
</tr>

<tr>
<td><b>Aadhaar</b></td>
<td>{{ farmer.aadhaar }}</td>
</tr>

<tr>
<td><b>Village</b></td>
<td>{{ farmer.village }}</td>
</tr>

<tr>
<td><b>District</b></td>
<td>{{ farmer.district }}</td>
</tr>

<tr>
<td><b>Land</b></td>
<td>{{ farmer.land }} Acres</td>
</tr>

<tr>
<td><b>Crop</b></td>
<td>{{ farmer.crop }}</td>
</tr>

<tr>
<td><b>Subsidy</b></td>
<td>{{ farmer.subsidy }}</td>
</tr>

<tr>
<td><b>Eligible</b></td>
<td>{{ farmer.eligible }}</td>
</tr>

<tr>
<td><b>Issued</b></td>
<td>{{ farmer.issued }}</td>
</tr>

<tr>
<td><b>Balance</b></td>
<td>{{ farmer.balance }}</td>
</tr>

<tr>
<td><b>Status</b></td>
<td>{{ farmer.status }}</td>
</tr>

<tr>
<td><b>Latitude</b></td>
<td>{{ farmer.latitude }}</td>
</tr>

<tr>
<td><b>Longitude</b></td>
<td>{{ farmer.longitude }}</td>
</tr>

</table>

<a href="{{ url_for('farmer_details', id=farmer.id) }}"
class="btn btn-success btn-sm w-100">

View Full Details

</a>

</div>

`);

    bounds.push([lat,lng]);

    markerCount++;

}

{% endif %}

{% endfor %}

// Fit map to markers
if(markerCount > 0){

    map.fitBounds(bounds,{
        padding:[40,40]
    });

}else{

    L.popup()
        .setLatLng([11.1271,78.6569])
        .setContent("<b>No farmer locations available.</b><br>Please add valid latitude and longitude while registering farmers.")
        .openOn(map);

}

</script>

{% endblock %}
