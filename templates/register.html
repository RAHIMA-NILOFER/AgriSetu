{% extends "base.html" %}

{% block title %}Register Farmer{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3 class="mb-0">
                Register New Farmer
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Mobile Number
                        </label>

                        <input
                            type="text"
                            name="mobile"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            name="gender"
                            class="form-select"
                            required>

                            <option value="">Select</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Aadhaar Number
                        </label>

                        <input
                            type="text"
                            name="aadhaar"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Village
                        </label>

                        <input
                            type="text"
                            name="village"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            District
                        </label>

                        <input
                            type="text"
                            name="district"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Land Area (Acres)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="land"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Crop
                        </label>

                        <input
                            type="text"
                            name="crop"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

    <label class="form-label">
        Subsidy Type
    </label>

    <select
        name="subsidy"
        class="form-select"
        required>

        <option value="">Select Subsidy</option>

        <option value="Rice Seeds">Rice Seeds</option>
        <option value="Wheat Seeds">Wheat Seeds</option>
        <option value="DAP Fertilizer">DAP Fertilizer</option>
        <option value="Urea">Urea</option>
        <option value="Organic Fertilizer">Organic Fertilizer</option>
        <option value="Pesticide">Pesticide</option>
        <option value="Sprayer">Sprayer</option>
        <option value="Drip Kit">Drip Kit</option>
        <option value="Water Pump">Water Pump</option>
        <option value="Tractor Subsidy">Tractor Subsidy</option>

    </select>

</div>
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Eligible Quantity
                        </label>

                        <input
                            type="number"
                            name="eligible"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Latitude
                        </label>

                        <input
                            type="text"
                            name="latitude"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Longitude
                        </label>

                        <input
                            type="text"
                            name="longitude"
                            class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Bank Name
                        </label>

                        <input
                            type="text"
                            name="bank"
                            class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Account Number
                        </label>

                        <input
                            type="text"
                            name="account"
                            class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            IFSC Code
                        </label>

                        <input
                            type="text"
                            name="ifsc"
                            class="form-control">

                    </div>

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-success">

                        Register Farmer

                    </button>

                    <a
                        href="{{ url_for('farmers') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
